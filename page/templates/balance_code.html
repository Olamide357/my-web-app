{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4">
                    <h3 class="text-primary fw-bold mb-4 text-center">BALANCE CODE</h3>
                    <hr class="mb-4">
                    <!-- MTN -->
                     <div class="card mb-3 shadow-sm border-0 rounded-3">
                        <div class="card-body d-flex align-items-center">
                            <img src="{% static 'images/m-t-n.png' %}" alt="MTN" class="me-3" style="width: 60px; height: auto;">
                            <div>
                                <p class="mb-1 fw-semibold">Normal Data and CG: *323*1#</p>
                                <p class="mb-1 fw-semibold">SME Data: *323*3#</p>
                                <p class="mb-0 fw-semibold">Airtime: *310#</p>
                            </div>
                        </div>
                     </div>

                     <!-- Airtel -->
                      <div class="card mb-3 shadow-sm border-0 rounded-3">
                        <div class="card-body d-flex align-items-center">
                            <img src="{% static 'images/airtel.png' %}" alt="Airtel" class="me-3" style="width: 60px; height: auto;">
                            <div>
                                <p class="mb-1 fw-semibold">Normal Data: *323#</p>
                            </div>
                        </div>
                      </div>

                      <!-- GLO -->
                       <div class="card mb-3 shadow-sm border-0 rounded-3">
                        <div class="card-body d-flex align-items-center">
                            <img src="{% static 'images/glo.png' %}" alt="GLO" class="me-3" style="width: 60px; height: auto;">
                            <div>
                                <p class="mb-1 fw-semibold">Normal Data: *323#</p>
                                <p class="mb-0 fw-semibold">Airtime: *310#</p>
                            </div>
                        </div>
                       </div>

                       <!-- 9Mobile -->
                        <div class="card mb-3 shadow-sm border-0 rounded-3">
                            <div class="card-body d-flex align-items-center">
                                <img src="{% static 'images/etisalat.png' %}" alt="9mobile" class="me-3" style="width: 60px; height: auto;">
                                <div>
                                    <p class="mb-1 fw-semibold">Normal Data: *323#</p>
                                    <p class="mb-0 fw-semibold">Airtime: *310#</p>
                                </div>
                            </div>
                        </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
