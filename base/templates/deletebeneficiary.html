{% extends 'base.html' %}
{% block content %}
<h3>Are you sure you want to delete {{ beneficiary.name }}</h3>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary">Yes, Delete</button>
    <a href="{% url 'beneficiary_list' %}" class="btn btn-primary">Cancel</a>
</form>

{% endblock %}
