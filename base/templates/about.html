{% extends 'base.html' %}

{% block content %}
<div class="profile-card" style="max-width: 500px; margin: auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);">
    <h2 style="color: #00aaff; text-transform: uppercase;">Profile</h2>
    <hr style="border: 1px solid #00aaff;">
<p><strong>Username:</strong> {{ request.user.username|upper }}</p>
<p><strong>Email:</strong> {{ request.user.email }}</p>
<p><strong>Phone Number:</strong> {{ request.user.userprofile.phone }}</p>

<div style="display: flex; justify-content: space-between;">
<a href="{% url 'edit' %}" style="color: #4aa4ff; text-decoration: none; text-transform: uppercase;">edit account</a>

<a href="{% url 'logout' %}" style="color: red; text-decoration: none;">SIGN OUT</a>
</div>
<form action="{% url 'delete_account' %}" method="POST">
    {% csrf_token %}
    <button type="submit" style="background: red; color: white; padding: 10px 20px; border-radius: 5px;">Delete Account</button>
</form>
</div>
{% endblock %}
