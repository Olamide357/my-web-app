{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 500px; margin: auto; padding: 20px; border-radius: 10px; box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);">

<h3 style="color: #00aaff; text-transform: uppercase;">Edit Profile</h3>
<hr>
<form method="POST">
    {% csrf_token %}
    {{ profile_form.as_p }}
    <button type="submit" name="edit_profile" style="background: #00aaff; color: white; padding: 10px 15px; border: none; border-radius: 5px;">Save Changes</button>
</form>

<hr>

<h3>Change Password</h3>
<form method="POST">
    {% csrf_token %}
    {{ password_form.as_p }}
    <button type="submit" name="change_password" style="background: #ff4d4d; color: white; padding: 10px 15px; border: none; border-radius: 5px;">Save Password</button>
</form>
</div>
{% endblock %}
